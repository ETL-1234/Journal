<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>My Journal</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />

  <style>
    body {
      margin: 0;
      font-family: 'Inter', sans-serif;
      background: #F8F3EF;
      color: #000;
      display: flex;
      justify-content: center;
    }

     html, body {
  min-height: 100vh;
  overflow: hidden;
}

    .app {
      max-width: 900px;
      width: 100%;
      min-height:100vh;
      position: relative;
      flex-direction:column;
      display:flex;
         }

    .page { 
    display: none; 
    height: 100%; 
    padding: 0;
    box-sizing: border-box; 
    flex: 1;
    min-height: 0; 
   }
    
    .page.active { 
      display: flex;           
     flex-direction: column;  
    }

    .cover-wrapper { 
      position: relative; 
      margin-top: 8px; 
    }
    
    .cover-wrapper img { 
      width: 100%; 
      border-radius: 16px; 
      box-shadow: 0 0px 0px rgba(0,0,0,0.12); 
    }
    
    .skip-btn, .next-btn {
      position: absolute; 
      background: none; 
      border: none; 
      cursor: pointer;
    }
    
    .skip-btn { 
      bottom: 16px; 
      left: 50%; 
      transform: translateX(-50%); 
      font-size: 14px; 
      text-decoration: underline; 
    }
    
    .next-btn { 
      bottom: 16px; 
      right: 16px; 
      font-size: 28px;
    }

    .card {
      background: #fff;
      border-radius: 16px;
      padding: 20px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.12);
      font-size: 14px;
      line-height: 1.6;
      margin-top: 2px;
      position: relative;

      display: flex;              
      flex-direction: column;     
      flex: 1;
      min-height: 0;
      }

    textarea {
      font-family: 'Inter', sans-serif;
    }

    .journalPanel {
  flex: 1;      
  margin-top: auto;
  min-height: 0;
  background: #fff;
  border-top-left-radius: 36px;
  border-top-right-radius: 36px;
  box-shadow: 0 -12px 30px rgba(0,0,0,0.15);
  padding: 20px 20px 0px 20px;
  display: flex;
  flex-direction: column;
  width: 100%;           /* stay inside container */
  box-sizing: border-box; /*  prevents overflow */
    }

    .entryNav {
  position: absolute;
  bottom: 30px;
  left: 50%;
  transform: translateX(-50%);
  width: 80%;   /* controls how far apart buttons are */  
  display: flex;
  justify-content: space-between;
  background: transparent;
  padding: 12px 0 4px 0;
  font-size: 12px;
}

/* textarea behavior */
.journalPanel textarea {
  flex: 1;
  width: 100%;
  min-height: 0;
  border: none;
  resize: none;
  outline: none;
  background: transparent;
  font-family: 'Inter', sans-serif;
  font-size: 14px;
  line-height: 1.6;
  padding: 0px; 
  height: auto;
  max-height: calc(100% - 80px);
  overflow: hidden; /*  removes scroll */
}

  /* Calendar day buttons only */
#calendarGrid button {
  border: 1px solid #f5eee8;
  padding: 6px;
  border-radius: 8px;
  background: #fff;
  cursor: pointer;
}

#prevMonth,
#nextMonth,
#closeCalendar,
#downloadEntries {
  background: #fff;
  border: #fff;
  padding: 0;
  box-shadow: none;
  border-radius: 0;
  cursor: pointer;
}

   

  </style>
</head>

<body>
<div class="app">

    <!-- JOURNAL PAGE -->
  <div id="journalPage" class="page active">
  <div style="display:flex; flex-direction:column; flex:1; min-height:0; height:100%;">
      <h1 style="font-size:22px; font-weight:400;padding: 0 0 0 30px;margin-bottom:6px;"></h1>
      <p style="font-size:16px; color:#555; padding: 0 0 0 30px;margin-bottom: 80px;">Start journaling, create a new entry in your private journal.</p>

      <div style="display:flex; justify-content:space-between; align-items:center; padding: 0 0 0 30px; margin-bottom:20px;">
  <p id="currentDate" style="font-size:12px; color:#888;"></p>

  <div style="display:flex; gap:8px;">
    <button id="newEntryBtn"
      style="font-size:16px; padding:8px 16px; border-radius:8px; border:2px solid #fff; box-shadow:none; background:#f5eee8; transition: background 0.2s ease; cursor:pointer; -webkit-appearance: none;
    appearance: none;
  ">
      New Entry
    </button>

    <button id="openCalendar"
  style="font-size:16px; padding:8px 16px; border-radius:8px; border:2px solid #fff; box-shadow:none; background:#f5eee8; transition: background 0.2s ease; cursor:pointer;margin-right:30px;">
  Calendar
</button>
  </div>
</div>

<div class="journalPanel">

  <textarea id="journalTextarea" placeholder="Start writing..."></textarea>

    <div class="entryNav">
    <button id="earlierEntry" style="background:none; border:none; cursor:pointer;">← Earlier entry</button>
    <button id="laterEntry" style="background:none; border:none; cursor:pointer;">Later entry →</button>
  </div>

</div>
       

      
    <!-- Calendar Overlay -->
    <div id="calendarOverlay" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,0.4); justify-content:center; align-items:center;">
      <div style="background:#fff; border-radius:16px; padding:16px; width:90%; max-width:360px;">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;">
          <button id="prevMonth">‹</button>
          <h2 id="calendarTitle" style="font-weight:bold;"></h2>
          <button id="nextMonth">›</button>
        </div>
        <div id="calendarGrid" style="display:grid; grid-template-columns:repeat(7,1fr); gap:4px; text-align:center; font-size:12px;"></div>
        <div style="display:flex; justify-content:space-between; margin-top:12px; font-size:12px;">
          <button id="closeCalendar" style="text-decoration:underline;">Close</button>
          <button id="downloadEntries" style="text-decoration:underline;">Download</button>
        </div>
      </div>
    </div>
  </div>

</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  
<script>
const SUPABASE_URL = "https://tppyzexttkuvcobbbmaz.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_VZiTsc0JGVx6tVf2Zu-9uQ_-FwjGpQW";
 
// ANALYTICS core
const APP_NAME = "ETL";
const CONTENT_NAME = document.title;

async function track(eventType, metadata = {}) {
  try {
    const response = await fetch(`${SUPABASE_URL}/rest/v1/analytics_journal`, {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        apikey: SUPABASE_ANON_KEY,
        Authorization: `Bearer ${SUPABASE_ANON_KEY}`,
        Prefer: "return=minimal"
      },
      body: JSON.stringify({
        app_name: APP_NAME,
        title_name: CONTENT_NAME,
        event_type: eventType,
        metadata: metadata
      })
    });

    if (!response.ok) {
      const errorText = await response.text();
      console.error("Analytics HTTP Error:", response.status, errorText);
    } else {
      console.log("Analytics tracked:", eventType);
    }
  } catch (err) {
    console.error("Analytics network error:", err);
  }
}

// Session tracking
let hasTrackedEntryStart = false;
let sessionStartTime = null;
let lastWordCount = 0;

  
  // SHOW PAGE
function showPage(id) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  const page = document.getElementById(id);
  if (!page) return;

  page.classList.add('active');

  if (id === 'journalPage') {
    entryIndex = null;
    currentDate = new Date().toISOString().split('T')[0];
    textarea.value = '';
    updateDisplay();
  }
}

  // JOURNAL LOGIC
  const STORAGE_KEY = 'My_journal_entries_exhale_the_light';
  let entries = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}');
  let today = new Date();
  let currentDate = today.toISOString().split('T')[0];
  let entryIndex = null;
  
  const textarea = document.getElementById('journalTextarea');
  const currentDateEl = document.getElementById('currentDate');
  const earlierBtn = document.getElementById('earlierEntry');
  const laterBtn = document.getElementById('laterEntry');
  const calendarOverlay = document.getElementById('calendarOverlay');
  const openCalendarBtn = document.getElementById('openCalendar');
  const closeCalendarBtn = document.getElementById('closeCalendar');
  const downloadBtn = document.getElementById('downloadEntries');
  const calendarGrid = document.getElementById('calendarGrid');
  const calendarTitle = document.getElementById('calendarTitle');
  const prevMonthBtn = document.getElementById('prevMonth');
  const nextMonthBtn = document.getElementById('nextMonth');
  let calendarMonth = new Date(today.getFullYear(), today.getMonth(), 1);
  const newEntryBtn = document.getElementById('newEntryBtn');

  // ANALYTICS journal open
track("view", {
content: CONTENT_NAME
}); 

  function updateDisplay() {
  const dayEntries = entries[currentDate] || [];

  if (entryIndex !== null && dayEntries[entryIndex]) {
    // Existing entry
    textarea.value = dayEntries[entryIndex].text || '';
    const ts = dayEntries[entryIndex].timestamp
      ? new Date(dayEntries[entryIndex].timestamp).toLocaleTimeString([], {
          hour: '2-digit',
          minute: '2-digit'
        })
      : '';
    currentDateEl.textContent = currentDate + (ts ? ' · ' + ts : '');
  } else {
    // New entry
    textarea.value = '';
    currentDateEl.textContent = currentDate;
  }


  // --- NAV BUTTON STATE ---
  if (entryIndex === null || dayEntries.length === 0) {
    // New entry or no entries at all
    earlierBtn.disabled = true;
    laterBtn.disabled = true;
  } else {
    earlierBtn.disabled = entryIndex === 0;
    laterBtn.disabled = entryIndex === dayEntries.length - 1;
  }

  // Visual feedback
  [earlierBtn, laterBtn].forEach(btn => {
    btn.style.opacity = btn.disabled ? '0.4' : '1';
    btn.style.pointerEvents = btn.disabled ? 'none' : 'auto';
  });

    autoResize();
}



function saveEntry() {
if (!textarea.value.trim()) return;

// ANALYTICS wordcount
  const wordCount = textarea.value
    .trim()
    .split(/\s+/)
    .filter(Boolean)
    .length;

  if (!entries[currentDate]) entries[currentDate] = [];

  if (entryIndex === null) {
    // New entry
    entries[currentDate].push({
      text: textarea.value,
      timestamp: new Date().toString()
    });

entryIndex = entries[currentDate].length - 1;

// ANALYTICS saved
    track("entry_saved", {
      content: CONTENT_NAME,
      word_count: wordCount
    });
  } else {
    // Existing entry updated
entries[currentDate][entryIndex].text = textarea.value;

// ANALYTICS updated
    track("entry_saved", {
  content: CONTENT_NAME,
  word_count: wordCount,
  date: currentDate,
  entry_length: textarea.value.length
});
  }

  lastWordCount = wordCount;

  localStorage.setItem(STORAGE_KEY, JSON.stringify(entries));
}

  
  textarea.addEventListener('input', () => {
    // ANALYTICS started session
  // Start session on first keystroke
  if (!hasTrackedEntryStart) {
    sessionStartTime = Date.now();

     track("entry_started", {
  content: CONTENT_NAME,
  start_time: new Date().toISOString()
});

    hasTrackedEntryStart = true;
  }

  saveEntry();
  autoResize();
});

  // auto-expand (no scroll)
function autoResize() {
  textarea.style.height = "auto";
  textarea.style.height = "100%";
}


  earlierBtn.addEventListener('click', () => { if(entryIndex>0){entryIndex--; updateDisplay();}});
  laterBtn.addEventListener('click', () => { if(entryIndex<(entries[currentDate]?.length||0)-1){entryIndex++; updateDisplay();}});

  newEntryBtn.addEventListener('click', () => {
  entryIndex = null;                         // detach from old entries
  currentDate = new Date().toISOString().split('T')[0]; // today
  textarea.value = '';                       // blank page
  updateDisplay();
  textarea.focus();
});

  // CALENDAR
  function generateCalendar() {
    const year = calendarMonth.getFullYear();
    const month = calendarMonth.getMonth();
    calendarTitle.textContent = calendarMonth.toLocaleString('default', {month:'long', year:'numeric'});
    calendarGrid.innerHTML = '';
    const startDay = new Date(year, month, 1).getDay();
    const daysInMonth = new Date(year, month+1, 0).getDate();

    ['S','M','T','W','T','F','S'].forEach(d => { const div=document.createElement('div'); div.textContent=d; calendarGrid.appendChild(div);});
    for(let i=0;i<startDay;i++) calendarGrid.appendChild(document.createElement('div'));

    for(let d=1;d<=daysInMonth;d++){
      const btn=document.createElement('button');
      btn.textContent=d;
      const dateKey = `${year}-${String(month+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
      if(entries[dateKey]) btn.style.background='rgba(122,156,183,0.5)';
      btn.addEventListener('click', () => {

// ANALYTICS date selected 
  track("entry_selected", {
    content: CONTENT_NAME,
    selected_date: dateKey,
    entry_count: entries[dateKey]?.length || 0
  });

  currentDate = dateKey;
  entryIndex = (entries[currentDate]?.length || 0) - 1;
  updateDisplay();
  calendarOverlay.style.display = 'none';
});
      
      calendarGrid.appendChild(btn);
    }
  }

  openCalendarBtn.addEventListener('click', () => {

// ANALYTICS calendar open
  track("calendar_opened", {
    content: CONTENT_NAME
  });

  calendarOverlay.style.display = 'flex';
  generateCalendar();
});
  
  closeCalendarBtn.addEventListener('click', ()=>calendarOverlay.style.display='none');
  prevMonthBtn.addEventListener('click', ()=>{calendarMonth.setMonth(calendarMonth.getMonth()-1); generateCalendar();});
  nextMonthBtn.addEventListener('click', ()=>{calendarMonth.setMonth(calendarMonth.getMonth()+1); generateCalendar();});

    downloadBtn.addEventListener('click', async () => {

  try {

    // ---------------------------------------------------------
    // 1. GET ACTIVE PAGE 2 TEMPLATE FROM SUPABASE
    // ---------------------------------------------------------

    const templateResponse = await fetch(
      `${SUPABASE_URL}/rest/v1/journal_my_template?app_name=eq.${encodeURIComponent(APP_NAME)}&active=eq.true&limit=1`,
      {
        headers: {
          apikey: SUPABASE_ANON_KEY,
          Authorization: `Bearer ${SUPABASE_ANON_KEY}`
        }
      }
    );

    if (!templateResponse.ok) {
      console.error('Could not load journal template.');
      return;
    }

    const templates = await templateResponse.json();

    if (!templates.length) {
      console.error('No active journal template found.');
      return;
    }

    const template = templates[0];


    // ---------------------------------------------------------
    // 2. GET ALL ACTIVE COVER IMAGES
    // ---------------------------------------------------------

    const coverResponse = await fetch(
      `${SUPABASE_URL}/rest/v1/journal_my_template_cover?active=eq.true&order=order_by.asc`,
      {
        headers: {
          apikey: SUPABASE_ANON_KEY,
          Authorization: `Bearer ${SUPABASE_ANON_KEY}`
        }
      }
    );

    if (!coverResponse.ok) {
      console.error('Could not load journal covers.');
      return;
    }

    const covers = await coverResponse.json();

    if (!covers.length) {
      console.error('No active journal covers found.');
      return;
    }


    // ---------------------------------------------------------
    // 3. CHOOSE NEXT COVER
    // ---------------------------------------------------------

    const COVER_ROTATION_KEY = 'journal_cover_rotation_index';

    let coverIndex = parseInt(
      localStorage.getItem(COVER_ROTATION_KEY) || '0',
      10
    );

    if (coverIndex >= covers.length || coverIndex < 0) {
      coverIndex = 0;
    }

    const selectedCover = covers[coverIndex];

    const nextCoverIndex =
      (coverIndex + 1) % covers.length;


    // ---------------------------------------------------------
    // 4. LOAD COVER IMAGE
    // ---------------------------------------------------------

    async function imageUrlToJPEGDataURL(url) {

      const response = await fetch(url);

      if (!response.ok) {
        throw new Error('Could not load cover image.');
      }

      const blob = await response.blob();

      const objectURL = URL.createObjectURL(blob);

      try {

        const img = new Image();

        await new Promise((resolve, reject) => {

          img.onload = resolve;
          img.onerror = reject;

          img.src = objectURL;

        });

        const canvas = document.createElement('canvas');

        canvas.width = img.naturalWidth;
        canvas.height = img.naturalHeight;

        const ctx = canvas.getContext('2d');

        ctx.drawImage(
          img,
          0,
          0,
          canvas.width,
          canvas.height
        );

        return canvas.toDataURL('image/jpeg', 0.95);

      } finally {

        URL.revokeObjectURL(objectURL);

      }
    }


    const coverData = await imageUrlToJPEGDataURL(
      selectedCover.cover_image
    );


    // ---------------------------------------------------------
    // 5. CREATE PDF
    // ---------------------------------------------------------

    if (!window.jspdf || !window.jspdf.jsPDF) {
      console.error('jsPDF did not load.');
      return;
    }

    const { jsPDF } = window.jspdf;

    const doc = new jsPDF({
      orientation: 'portrait',
      unit: 'mm',
      format: 'a4'
    });

    const pageWidth =
      doc.internal.pageSize.getWidth();

    const pageHeight =
      doc.internal.pageSize.getHeight();


    // ---------------------------------------------------------
    // PAGE 1 — COVER
    // ---------------------------------------------------------

    doc.addImage(
      coverData,
      'JPEG',
      0,
      0,
      pageWidth,
      pageHeight
    );


    // ---------------------------------------------------------
    // PAGE 2 — INTRO
    // ---------------------------------------------------------

    doc.addPage();

    doc.setTextColor(0, 0, 0);

    // Title
    doc.setFont('helvetica', 'bold');
    doc.setFontSize(24);

    const title =
      template.intro_title || '';

    const titleY = 85;

    doc.text(
      title,
      pageWidth / 2,
      titleY,
      {
        align: 'center'
      }
    );


    // Intro text
    doc.setFontSize(11);

    const introText =
      template.intro_text || '';

    const introWidth =
      pageWidth * 0.70;

    const introLines =
      doc.splitTextToSize(
        introText,
        introWidth
      );

    const introY =
      titleY + 20;

    doc.text(
      introLines,
      pageWidth / 2,
      introY,
      {
        align: 'center',
        lineHeightFactor: 1.6
      }
    );


// ---------------------------------------------------------
// FOOTER — PAGE 2
// ---------------------------------------------------------

if (template.footer_text) {

  doc.setFont('helvetica', 'normal');
  doc.setFontSize(8);
  doc.setTextColor(0, 0, 0);

  doc.text(
    template.footer_text,
    pageWidth / 2,
    pageHeight - 12,
    {
      align: 'center'
    }
  );

}

// ---------------------------------------------------------
// PAGE 3+ — JOURNAL ENTRIES
// ---------------------------------------------------------

const marginLeft = 20;
const marginRight = 20;
const topMargin = 25;
const bottomMargin = 22;

const contentWidth =
  pageWidth -
  marginLeft -
  marginRight;


// ---------------------------------------------------------
// FOOTER HELPER
// ---------------------------------------------------------

function addFooter() {

  if (!template.footer_text) return;

  doc.setFont('helvetica', 'normal');
  doc.setFontSize(8);
  doc.setTextColor(0, 0, 0);

  doc.text(
    template.footer_text,
    pageWidth / 2,
    pageHeight - 12,
    {
      align: 'center'
    }
  );

}


// ---------------------------------------------------------
// NEW JOURNAL PAGE HELPER
// ---------------------------------------------------------

function startJournalPage() {

  doc.addPage();

  y = topMargin;

  addFooter();

}


// ---------------------------------------------------------
// CREATE FIRST JOURNAL PAGE — PAGE 3
// ---------------------------------------------------------

let y = topMargin;

doc.addPage();

y = topMargin;

addFooter();


// ---------------------------------------------------------
// LOOP THROUGH ALL JOURNAL ENTRIES
// ---------------------------------------------------------

const sortedEntries =
  Object.entries(entries)
    .sort(([dateA], [dateB]) =>
      dateA.localeCompare(dateB)
    );


for (const [date, dayEntries] of sortedEntries) {

  for (const entry of dayEntries) {

    // -----------------------------------------------------
    // CHECK SPACE FOR DATE
    // -----------------------------------------------------

    if (
      y >
      pageHeight -
      bottomMargin -
      25
    ) {
      startJournalPage();
    }


    // -----------------------------------------------------
    // DATE + TIME — BOLD
    // -----------------------------------------------------

    doc.setFont('helvetica', 'bold');
    doc.setFontSize(11);
    doc.setTextColor(0, 0, 0);

    const time =
      entry.timestamp
        ? new Date(
            entry.timestamp
          ).toLocaleTimeString([], {
            hour: '2-digit',
            minute: '2-digit'
          })
        : '';

    const dateHeading =
      date +
      (time ? ' · ' + time : '');


    doc.text(
      dateHeading,
      marginLeft,
      y
    );

    y += 8;


    // -----------------------------------------------------
    // ENTRY TEXT — NORMAL
    // -----------------------------------------------------

    doc.setFont('helvetica', 'normal');
    doc.setFontSize(11);

    const entryLines =
      doc.splitTextToSize(
        entry.text || '',
        contentWidth
      );

    const lineHeight = 5.5;


    for (const line of entryLines) {

      if (
        y >
        pageHeight -
        bottomMargin
      ) {
        startJournalPage();
      }

      doc.text(
        line,
        marginLeft,
        y
      );

      y += lineHeight;

    }


    // -----------------------------------------------------
    // SPACE BETWEEN ENTRIES
    // -----------------------------------------------------

    y += 10;

  }

}


// ---------------------------------------------------------
// FOOTER — CURRENT PAGE
// ---------------------------------------------------------

addFooter();
        // ---------------------------------------------------------
    // ANALYTICS — DOWNLOAD
    // ---------------------------------------------------------

    track("download", {
      content: CONTENT_NAME,
      total_entries: Object.values(entries)
        .reduce(
          (sum, dayEntries) =>
            sum + dayEntries.length,
          0
        ),
      cover_number: selectedCover.order_by
    });


    // ---------------------------------------------------------
    // SAVE PDF
    // ---------------------------------------------------------

    doc.save('My_journal_entries_exhale_the_light.pdf');


    // Only move to the next cover AFTER
    // the PDF has successfully been created.
    localStorage.setItem(
      COVER_ROTATION_KEY,
      nextCoverIndex.toString()
    );


  } catch (error) {
console.error('Journal PDF download error:', error);
    }

}); 
    
// ANALYTICS session completed
window.addEventListener('beforeunload', () => {
  if (!sessionStartTime) return;

  const timeSpentSeconds = Math.floor(
    (Date.now() - sessionStartTime) / 1000
  );

  track("completed", {
  content: CONTENT_NAME,
  time_spent_seconds: timeSpentSeconds,
  word_count: lastWordCount,
  session_type: "journal",
  date: currentDate
});
});
  
  updateDisplay();
</script>

</body>
</html>
