<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<title>Gratitude Reflection</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet"/>

<style>

  html,body{
margin:0;
padding:0;
min-height:100vh;
overflow:hidden;
}

  body{
font-family:'Inter',sans-serif;
display:flex;
}
  
.app{
width:100%;
max-width:900px;
min-height:100vh;
position:relative;
display:flex;
flex-direction:column;
margin:0 auto;
box-sizing:border-box;

background-size:cover;
background-position:center;
background-repeat:no-repeat;
}

/* DARK OVERLAY */

.overlay{
position:absolute;
inset:0;
background:rgba(0,0,0,0.25);
pointer-events:none;
z-index:1;
}

/* PROMPT AREA */

.promptArea{
flex:1;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
text-align:center;
padding:40px;
color:white;
z-index:2;
}

#prompt{
font-size:20px;
line-height:1.5;
margin-bottom:28px;
max-width:520px;
}

/* REFRESH BUTTON */

.refreshBtn{
display:flex;
align-items:center;
gap:8px;
background:transparent;
border:1.5px solid white;
color:white;
padding:10px 18px;
border-radius:24px;
font-size:14px;
cursor:pointer;
}

/* IMAGE BUTTON */

.imageBtn{
position:absolute;
top:18px;
right:18px;
width:28px;
height:28px;
cursor:pointer;
z-index:3;
}

/* JOURNAL PANEL */

.journalPanel{
  height:40vh;
  min-height:320px;
  max-height:420px;

  background: rgba(255,255,255,1);  /* ↑ increase opacity slightly */
  backdrop-filter: blur(14px) saturate(140%);
  -webkit-backdrop-filter: blur(14px) saturate(140%);

  padding:24px;
  border-top-left-radius:36px;
  border-top-right-radius:36px;
  box-shadow:
     0 -12px 30px rgba(0,0,0,0.5),
     inset 0 1px 0 rgba(255,255,255,0.6);
  display:flex;
  flex-direction:column;
  z-index:3;
  margin-top:auto;
}

  .journalContent{
  flex:1;
  overflow-y:auto;
  display:flex;
  flex-direction:column;
  scrollbar-width:none;
  -ms-overflow-style:none;
}

.journalContent::-webkit-scrollbar{
  display:none;
}


  
/* DATE */

.journalDate{
font-size:13px;
color:#333;
margin-bottom:10px;
}

/* TEXT AREA */

textarea{
flex:1;
width:100%;
border:none;
resize:none;
outline:none;
font-family:'Inter', sans-serif;
font-size:16px;
font-weight:400;
color:#000;
line-height:1.6;
background:transparent;
overflow:hidden;     /* prevents internal scroll */
min-height:120px;
max-height:120px;
overflow-y:auto;
scrollbar-width:none;
}

  textarea::-webkit-scrollbar{
  display:none;
}

  #entriesContainer{
  flex:1;
}
  
  .entryBlock{
margin-bottom:32px;
}

.entryPrompt{
font-size:14px;
font-style:italic;
color:#999;
line-height:1.6;
margin-bottom:0px;
}

.entryReflection{
font-size:16px;
line-height:1.8;
color:#999;
white-space:pre-wrap;
}

/* DOWNLOAD */

.download{
  display:flex;
  justify-content:flex-end;
  cursor:pointer;
  margin-top:8px;
}

.download svg{
  width:20px;
  height:20px;
  flex-shrink: 0;     /* prevents flex stretching */
  display: block;     /* removes weird inline scaling */
  opacity:0.7;
  transition:opacity 0.2s ease, transform 0.2s ease;
}

.download:hover svg{
  opacity:1;
  transform:translateY(1px);
}

  
</style>
</head>

<script>

/* SUPABASE */

const SUPABASE_URL = "https://tppyzexttkuvcobbbmaz.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_VZiTsc0JGVx6tVf2Zu-9uQ_-FwjGpQW";

/* ANALYTICS */

const APP_NAME = "ETL";
const CONTENT_NAME = "Gratitude Journal";

async function track(eventType, metadata = {}) {
  try {
    const response = await fetch(
      `${SUPABASE_URL}/rest/v1/analytics_journal`,
      {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          apikey: SUPABASE_ANON_KEY,
          Authorization: `Bearer ${SUPABASE_ANON_KEY}`,
          Prefer: "return=minimal"
        },
        body: JSON.stringify({
          app_name: APP_NAME,
          title_name: CONTENT_NAME,
          event_type: eventType,
          metadata: metadata
        })
      }
    );

    if (!response.ok) {
      const errorText = await response.text();
      console.error(
        "Analytics HTTP Error:",
        response.status,
        errorText
      );
    }
  } catch (err) {
    console.error("Analytics network error:", err);
  }
}

/* SESSION TRACKING */

let hasTrackedEntryStart = false;
let sessionStartTime = null;
let lastWordCount = 0;
  

/* BACKGROUND IMAGE */

const app = document.querySelector(".app");

const defaultImage = "https://tppyzexttkuvcobbbmaz.supabase.co/storage/v1/object/public/GratitudeImages/Standardbackground.jpg";

let savedImage = localStorage.getItem("gratitude_bg");

if (!savedImage || savedImage === "null" || savedImage.trim() === "") {
  savedImage = defaultImage;
}

const img = new Image();

img.onload = () => {
  app.style.backgroundImage = `url(${savedImage})`;
};

img.onerror = () => {
  app.style.backgroundImage = `url(${defaultImage})`;
};

img.src = savedImage;

  
/* DATE */

const today = new Date().toISOString().split('T')[0];
document.getElementById("currentDate").textContent = today;

  /* ANALYTICS */
track("view", {
  content: CONTENT_NAME
});
  
/* PROMPT FETCH */

async function loadPrompt(){

const res = await fetch(
`${SUPABASE_URL}/rest/v1/gratitudeprompts?select=gratitude&active=eq.true`,
{
headers:{
apikey:SUPABASE_ANON_KEY,
Authorization:`Bearer ${SUPABASE_ANON_KEY}`
}
});

const data = await res.json();

const random = data[Math.floor(Math.random()*data.length)];

document.getElementById("prompt").textContent = random.gratitude;

  currentPrompt = random.gratitude;

  /* ANALYTICS */
track("prompt_loaded", {
  content: CONTENT_NAME,
  prompt_text: random.gratitude
});

  
}
let currentPrompt = "";
loadPrompt();

async function refreshPrompt() {

  if(
entries[today].length &&
entries[today][entries[today].length-1].active
){

entries[today][
entries[today].length-1
].active = false;

localStorage.setItem(
STORAGE,
JSON.stringify(entries)
);

renderEntries();

journalContent.scrollTop =
journalContent.scrollHeight;  

textarea.value = "";

textarea.style.height = "auto";

}
  await loadPrompt();

  const promptText =
    document.getElementById("prompt").textContent;
  
/* ANALYTICS */
  track("prompt_refreshed", {
    content: CONTENT_NAME,
    prompt_text: promptText
  });
}
  
  
/* IMAGE PAGE */

function openImages(){

  /* ANALYTICS */
   track("background_opened", {
    content: CONTENT_NAME
  });
  
window.location.href="https://etl-1234.github.io/Journal/jgi.html";
}

  document.querySelector(".imageBtn").onclick = openImages;

/* JOURNAL STORAGE */

const STORAGE = "gratitude_journal";

let entries =
JSON.parse(localStorage.getItem(STORAGE) || "{}");

if (!entries[today]) {
entries[today] = [];
}

 entries[today].forEach(entry=>{
  entry.active = false;
});

localStorage.setItem(
  STORAGE,
  JSON.stringify(entries)
);
  

const textarea =
document.getElementById("journal");

const entriesContainer =
document.getElementById("entriesContainer");

const activePrompt =
document.getElementById("activePrompt");

const journalContent =
document.querySelector(".journalContent");
  
function renderEntries(){

  entriesContainer.innerHTML = "";

  (entries[today] || []).forEach(entry=>{

    const block = document.createElement("div");

    block.className = "entryBlock";

    block.innerHTML = `
      <div class="entryPrompt">${entry.prompt}</div>
      <div class="entryReflection">${entry.reflection.trim()}</div>
    `;

    entriesContainer.appendChild(block);

  });

}

  renderEntries();
  
textarea.addEventListener("input",()=>{

  const text = textarea.value.trim();

  if(text){

  activePrompt.style.display = "block";
  activePrompt.textContent = currentPrompt;

}else{

  activePrompt.style.display = "none";

}

  const promptText =
    document.getElementById("prompt").textContent;

  /* ANALYTICS */

  if (!hasTrackedEntryStart) {

    sessionStartTime = Date.now();

    track("entry_started", {
      content: CONTENT_NAME,
      start_time: new Date().toISOString(),
      prompt_text: promptText
    });

    hasTrackedEntryStart = true;
  }

  /* EMPTY TEXT = REMOVE ACTIVE ENTRY */

  if (text === "") {

    if (
      entries[today].length &&
      entries[today][entries[today].length - 1].active
    ) {

      entries[today].pop();
    }

    localStorage.setItem(
      STORAGE,
      JSON.stringify(entries)
    );

    renderEntries();

    return;
  }

  /* CREATE NEW ACTIVE ENTRY */

  if (
    !entries[today].length ||
    !entries[today][entries[today].length - 1].active
  ) {

    entries[today].push({
      timestamp: new Date().toISOString(),
      prompt: currentPrompt,
      reflection: text,
      active: true
    });

  } else {

    /* UPDATE EXISTING ACTIVE ENTRY */

    entries[today][
      entries[today].length - 1
    ].reflection = text;
  }

  localStorage.setItem(
    STORAGE,
    JSON.stringify(entries)
  );

  /* SAVE ANALYTICS */

  const wordCount = text
    .trim()
    .split(/\s+/)
    .filter(Boolean)
    .length;

  lastWordCount = wordCount;

  track("entry_saved", {
    content: CONTENT_NAME,
    date: today,
    word_count: wordCount,
    entry_length: text.length,
    prompt_text: currentPrompt
  });
});
 

/* DOWNLOAD — GRATITUDE JOURNAL PDF */

async function downloadJournal(){

  try {

    // ---------------------------------------------------------
    // 1. GET ACTIVE GRATITUDE JOURNAL TEMPLATE FROM SUPABASE
    // ---------------------------------------------------------

    const templateResponse = await fetch(
      `${SUPABASE_URL}/rest/v1/journal_template?app_name=eq.${encodeURIComponent(APP_NAME)}&active=eq.true&type=eq.gratitudejournal&limit=1`,
      {
        headers: {
          apikey: SUPABASE_ANON_KEY,
          Authorization: `Bearer ${SUPABASE_ANON_KEY}`
        }
      }
    );

    if (!templateResponse.ok) {
      console.error('Could not load gratitude journal template.');
      return;
    }

    const templates = await templateResponse.json();

    if (!templates.length) {
      console.error('No active gratitude journal template found.');
      return;
    }

    const template = templates[0];


    // ---------------------------------------------------------
    // 2. GET ALL ACTIVE GRATITUDE JOURNAL COVERS
    // ---------------------------------------------------------

    const coverResponse = await fetch(
      `${SUPABASE_URL}/rest/v1/journal_template_cover?active=eq.true&type=eq.gratitudejournal&order=order_by.asc`,
      {
        headers: {
          apikey: SUPABASE_ANON_KEY,
          Authorization: `Bearer ${SUPABASE_ANON_KEY}`
        }
      }
    );

    if (!coverResponse.ok) {
      console.error('Could not load gratitude journal covers.');
      return;
    }

    const covers = await coverResponse.json();

    if (!covers.length) {
      console.error('No active gratitude journal covers found.');
      return;
    }


    // ---------------------------------------------------------
    // 3. CHOOSE NEXT GRATITUDE JOURNAL COVER
    // ---------------------------------------------------------

    // IMPORTANT:
    // This is intentionally different from the regular journal
    // cover rotation key.

    const COVER_ROTATION_KEY =
      'gratitude_journal_cover_rotation_index';

    let coverIndex = parseInt(
      localStorage.getItem(COVER_ROTATION_KEY) || '0',
      10
    );

    if (
      coverIndex >= covers.length ||
      coverIndex < 0
    ) {
      coverIndex = 0;
    }

    const selectedCover = covers[coverIndex];

    const nextCoverIndex =
      (coverIndex + 1) % covers.length;


    // ---------------------------------------------------------
    // 4. LOAD COVER IMAGE
    // ---------------------------------------------------------

    async function imageUrlToJPEGDataURL(url) {

      const response = await fetch(url);

      if (!response.ok) {
        throw new Error('Could not load gratitude journal cover image.');
      }

      const blob = await response.blob();

      const objectURL =
        URL.createObjectURL(blob);

      try {

        const img = new Image();

        await new Promise((resolve, reject) => {

          img.onload = resolve;
          img.onerror = reject;

          img.src = objectURL;

        });

        const canvas =
          document.createElement('canvas');

        canvas.width =
          img.naturalWidth;

        canvas.height =
          img.naturalHeight;

        const ctx =
          canvas.getContext('2d');

        ctx.drawImage(
          img,
          0,
          0,
          canvas.width,
          canvas.height
        );

        return canvas.toDataURL(
          'image/jpeg',
          0.95
        );

      } finally {

        URL.revokeObjectURL(objectURL);

      }

    }


    const coverData =
      await imageUrlToJPEGDataURL(
        selectedCover.cover_image
      );


    // ---------------------------------------------------------
    // 5. CHECK jsPDF
    // ---------------------------------------------------------

    if (
      !window.jspdf ||
      !window.jspdf.jsPDF
    ) {

      console.error('jsPDF did not load.');
      return;

    }

    const { jsPDF } =
      window.jspdf;


    // ---------------------------------------------------------
    // 6. CREATE PDF
    // ---------------------------------------------------------

    const doc =
      new jsPDF({
        orientation: 'portrait',
        unit: 'mm',
        format: 'a4'
      });

    const pageWidth =
      doc.internal.pageSize.getWidth();

    const pageHeight =
      doc.internal.pageSize.getHeight();


    // ---------------------------------------------------------
    // PAGE 1 — COVER
    // ---------------------------------------------------------

    doc.addImage(
      coverData,
      'JPEG',
      0,
      0,
      pageWidth,
      pageHeight
    );


    // ---------------------------------------------------------
    // PAGE 2 — GRATITUDE JOURNAL INTRO
    // ---------------------------------------------------------

    doc.addPage();

    doc.setTextColor(0, 0, 0);


    // Title

    doc.setFont(
      'helvetica',
      'bold'
    );

    doc.setFontSize(24);

    const title =
      template.intro_title || '';

    const titleY = 85;

    doc.text(
      title,
      pageWidth / 2,
      titleY,
      {
        align: 'center'
      }
    );


    // Intro text

    doc.setFont(
      'helvetica',
      'normal'
    );

    doc.setFontSize(11);

    const introText =
      template.intro_text || '';

    const introWidth =
      pageWidth * 0.70;

    const introLines =
      doc.splitTextToSize(
        introText,
        introWidth
      );

    const introY =
      titleY + 20;

    doc.text(
      introLines,
      pageWidth / 2,
      introY,
      {
        align: 'center',
        lineHeightFactor: 1.6
      }
    );


    // Quick tip

    const quickTip =
      template.quick_tip || '';

    if (quickTip.trim()) {

      const quickTipY =
        introY +
        (introLines.length * 5.5) +
        40;

      doc.setFont(
        'helvetica',
        'italic'
      );

      doc.setFontSize(11);

      doc.setTextColor(
        0,
        0,
        0
      );

      const quickTipLines =
        doc.splitTextToSize(
          quickTip,
          introWidth
        );

      doc.text(
        quickTipLines,
        pageWidth / 2,
        quickTipY,
        {
          align: 'center',
          lineHeightFactor: 1.6
        }
      );

    }


    // ---------------------------------------------------------
    // FOOTER — PAGE 2
    // ---------------------------------------------------------

    if (template.footer_text) {

      doc.setFont(
        'helvetica',
        'normal'
      );

      doc.setFontSize(8);

      doc.setTextColor(
        0,
        0,
        0
      );

      doc.text(
        template.footer_text,
        pageWidth / 2,
        pageHeight - 12,
        {
          align: 'center'
        }
      );

    }


    // ---------------------------------------------------------
    // PAGE 3+ — GRATITUDE ENTRIES
    // ---------------------------------------------------------

    const marginLeft = 20;
    const marginRight = 20;
    const topMargin = 25;
    const bottomMargin = 22;

    const contentWidth =
      pageWidth -
      marginLeft -
      marginRight;


    // ---------------------------------------------------------
    // FOOTER HELPER
    // ---------------------------------------------------------

    function addFooter() {

      if (!template.footer_text) return;

      doc.setFont(
        'helvetica',
        'normal'
      );

      doc.setFontSize(8);

      doc.setTextColor(
        0,
        0,
        0
      );

      doc.text(
        template.footer_text,
        pageWidth / 2,
        pageHeight - 12,
        {
          align: 'center'
        }
      );

    }


    // ---------------------------------------------------------
    // NEW JOURNAL PAGE HELPER
    // ---------------------------------------------------------

    function startJournalPage() {

      doc.addPage();

      y = topMargin;

      addFooter();

      // Restore entry font after footer

      doc.setFont(
        'helvetica',
        'normal'
      );

      doc.setFontSize(11);

      doc.setTextColor(
        0,
        0,
        0
      );

    }


    // ---------------------------------------------------------
    // CREATE FIRST JOURNAL PAGE — PAGE 3
    // ---------------------------------------------------------

    let y = topMargin;

    doc.addPage();

    y = topMargin;

    addFooter();


    // ---------------------------------------------------------
    // LOOP THROUGH ALL GRATITUDE ENTRIES
    // ---------------------------------------------------------

    const sortedEntries =
      Object.entries(entries)
        .sort(
          ([dateA], [dateB]) =>
            dateA.localeCompare(dateB)
        );


    for (
      const [date, dayEntries]
      of sortedEntries
    ) {

      for (
        const entry
        of dayEntries
      ) {


        // -----------------------------------------------------
        // CHECK SPACE FOR DATE
        // -----------------------------------------------------

        if (
          y >
          pageHeight -
          bottomMargin -
          35
        ) {

          startJournalPage();

        }


        // -----------------------------------------------------
        // DATE — BOLD
        // -----------------------------------------------------

        doc.setFont(
          'helvetica',
          'bold'
        );

        doc.setFontSize(11);

        doc.setTextColor(
          0,
          0,
          0
        );

        const time =
          entry.timestamp
            ? new Date(
                entry.timestamp
              ).toLocaleTimeString(
                [],
                {
                  hour: '2-digit',
                  minute: '2-digit'
                }
              )
            : '';


        const dateHeading =
          date +
          (
            time
              ? ' · ' + time
              : ''
          );


        doc.text(
          dateHeading,
          marginLeft,
          y
        );

        y += 8;


        // -----------------------------------------------------
        // GRATITUDE PROMPT
        // -----------------------------------------------------

        doc.setFont(
          'helvetica',
          'italic'
        );

        doc.setFontSize(10);

        const promptText =
          entry.prompt || '';

        const promptLines =
          doc.splitTextToSize(
            promptText,
            contentWidth
          );

        for (
          const line
          of promptLines
        ) {

          if (
            y >
            pageHeight -
            bottomMargin
          ) {

            startJournalPage();

            doc.setFont(
              'helvetica',
              'italic'
            );

            doc.setFontSize(10);

          }

          doc.text(
            line,
            marginLeft,
            y
          );

          y += 5;

        }


        y += 3;


        // -----------------------------------------------------
        // GRATITUDE REFLECTION
        // -----------------------------------------------------

        doc.setFont(
          'helvetica',
          'normal'
        );

        doc.setFontSize(11);

        const reflectionText =
          entry.reflection || '';

        const reflectionLines =
          doc.splitTextToSize(
            reflectionText,
            contentWidth
          );

        const lineHeight = 5.5;


        for (
          const line
          of reflectionLines
        ) {

          if (
            y >
            pageHeight -
            bottomMargin
          ) {

            startJournalPage();

            doc.setFont(
              'helvetica',
              'normal'
            );

            doc.setFontSize(11);

            doc.setTextColor(
              0,
              0,
              0
            );

          }

          doc.text(
            line,
            marginLeft,
            y
          );

          y += lineHeight;

        }


        // -----------------------------------------------------
        // SPACE BETWEEN GRATITUDE ENTRIES
        // -----------------------------------------------------

        y += 10;

      }

    }


    // ---------------------------------------------------------
    // FOOTER — CURRENT PAGE
    // ---------------------------------------------------------

    addFooter();


    // ---------------------------------------------------------
    // ANALYTICS — DOWNLOAD
    // ---------------------------------------------------------

    const totalEntries =
      Object.values(entries)
        .reduce(
          (sum, dayEntries) =>
            sum + dayEntries.length,
          0
        );

    track(
      "download",
      {
        content: CONTENT_NAME,
        total_entries: totalEntries,
        cover_number: selectedCover.order_by
      }
    );


    // ---------------------------------------------------------
    // SAVE PDF
    // ---------------------------------------------------------

    const downloadDate =
      new Date();

    const year =
      downloadDate.getFullYear();

    const month =
      String(
        downloadDate.getMonth() + 1
      ).padStart(2, '0');

    const day =
      String(
        downloadDate.getDate()
      ).padStart(2, '0');


    const fileName =
      `gratitude_journal_exhale_the_light_${year}_${month}_${day}.pdf`;


    doc.save(fileName);


    // ---------------------------------------------------------
    // MOVE TO NEXT COVER
    // ---------------------------------------------------------

    localStorage.setItem(
      COVER_ROTATION_KEY,
      nextCoverIndex.toString()
    );


  } catch (error) {

    console.error(
      'Gratitude Journal PDF download error:',
      error
    );

  }

}

window.addEventListener("beforeunload", () => {

  if (!sessionStartTime) return;

  const timeSpentSeconds = Math.floor(
    (Date.now() - sessionStartTime) / 1000
  );

  track("completed", {
    content: CONTENT_NAME,
    time_spent_seconds: timeSpentSeconds,
    word_count: lastWordCount,
    session_type: "gratitude_journal",
    date: today
  });
});

  
</script>
